org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=false

## Build targets (each has targets/<name>/gradle.properties and src/<name>/)
targets=neoforge-1.21.1,fabric-1.21.1,forge-1.20.1,fabric-1.20.1

## Which target's jar the local auto-copy init script may pick up (only this one is written by a
## Jar-type task; the others use a plain Copy, so a full build doesn't fill the test instance)
local_copy_target=neoforge-1.21.1

## Mod Properties
mod_id=cadaver
mod_name=Cadaver
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=ru.wamior.cadaver
mod_authors=wamior
mod_description=After death a corpse with your items appears. Respects Curse of Vanishing, keepInventory, soulbound-style enchantments from other mods and Curios / Trinkets. The corpse has no hitbox for bullets, arrows or attacks.
mod_homepage=https://modrinth.com/mod/cadaver
mod_sources=https://github.com/wamior/Cadaver
update_json_url=https://raw.githubusercontent.com/wamior/Cadaver/main/update.json
