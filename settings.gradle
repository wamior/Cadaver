pluginManagement {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'cadaver'

// One Gradle project per published jar. Each one compiles
//   src/common            shared by every target
//   src/mc-<version>      Minecraft-version shims shared by all loaders of that version
//   src/<loader>-<version> loader entry points, networking, events, Curios/Trinkets
// The list of targets lives in gradle.properties (`targets`) so the README and CI read one place.
def targets = providers.gradleProperty('targets').get().split(',')*.trim()
targets.each { name ->
    include name
    project(":$name").projectDir = file("targets/$name")
}
