modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="cadaver.png"
displayURL="https://modrinth.com/mod/cadaver"
issueTrackerURL="https://github.com/wamior/Cadaver/issues"
# NeoForge's built-in update checker: marks the mod in the mod list and on the title screen,
# and Cadaver also posts a chat notice on join (see neoforge/NeoForgeClient)
updateJSONURL="https://raw.githubusercontent.com/wamior/Cadaver/main/update.json"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="curios"
    type="optional"
    versionRange="[9,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
